apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Environment-independent manifests of the TaskFlow application. Overlays (gitops/overlays/*) add what
# differs per environment: image references, credentials, sizes.
namespace: taskflow

labels:
  - pairs:
      app.kubernetes.io/part-of: taskflow

resources:
  - namespace.yaml
  - postgres
  - migrate
