# Single PostgreSQL instance with its own volume. This is NOT highly available: one replica, and the
# local-path volume lives on one node's disk (ADR-0002, ADR-0007).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/component: database
    spec:
      automountServiceAccountToken: false
      # Room for a clean shutdown (checkpoint) before SIGKILL.
      terminationGracePeriodSeconds: 60
      securityContext:
        # UID/GID 70 is the "postgres" user of the Alpine image (Debian images use 999).
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          # Same image and digest as compose.yaml in taskflow-app.
          image: postgres:18.6-alpine3.24@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
          ports:
            - name: postgres
              containerPort: 5432
          envFrom:
            # POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB. Used only to initialise an empty volume.
            - secretRef:
                name: postgres-credentials
          # TCP checks, not the Unix socket: the first-boot init server listens on the socket only
          # and would be reported as ready (same reason as the compose healthcheck).
          startupProbe:
            exec:
              command: ["sh", "-c", 'pg_isready -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            exec:
              command: ["sh", "-c", 'pg_isready -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            # Restart only if the server stops accepting connections for a full minute.
            tcpSocket:
              port: postgres
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # PostgreSQL 18 images keep data under /var/lib/postgresql/18/docker; mount the parent.
            - name: data
              mountPath: /var/lib/postgresql
            # Writable paths needed with a read-only root filesystem: socket/lock files and temp files.
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        # No storageClassName: the cluster default is used (local-path on k3s, gp3 on EKS later).
        resources:
          requests:
            storage: 1Gi
