# The only public entry point: everything goes to the frontend (nginx), which serves the UI and forwards
# /api/ to the API. The API's /healthz, /readyz and /metrics are therefore not reachable from outside.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: taskflow
  labels:
    app.kubernetes.io/component: routing
spec:
  parentRefs:
    - name: public
      namespace: gateway
      sectionName: http
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: frontend
          port: 80
